<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎂 تولدت مبارک</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #ffc3d9 100%);
            background-size: 400% 400%;
            animation: bgMove 12s ease infinite;
            overflow: hidden;
            position: relative;
        }
        
        @keyframes bgMove {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }
        /* ===== بادکنک‌ها ===== */
        
        .balloon {
            position: absolute;
            width: 50px;
            height: 65px;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            animation: balloonRise linear infinite;
            pointer-events: none;
            opacity: 0.85;
        }
        
        .balloon::after {
            content: '';
            position: absolute;
            bottom: -14px;
            left: 50%;
            width: 1px;
            height: 18px;
            background: rgba(255, 255, 255, 0.7);
        }
        
        @keyframes balloonRise {
            0% {
                transform: translateY(110vh) rotate(-6deg);
            }
            100% {
                transform: translateY(-20vh) rotate(6deg);
            }
        }
        /* ===== قلب و ستاره‌های درخشان ===== */
        
        .sparkle {
            position: absolute;
            pointer-events: none;
            animation: fall linear infinite;
            opacity: 0;
        }
        
        @keyframes fall {
            0% {
                transform: translateY(-10vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }
        /* ===== حباب‌ها ===== */
        
        .bubble {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            animation: float 15s infinite ease-in-out;
            pointer-events: none;
        }
        
        @keyframes float {
            0%,
            100% {
                transform: translateY(0) scale(1);
                opacity: .4;
            }
            50% {
                transform: translateY(-60px) scale(1.2);
                opacity: .7;
            }
        }
        /* ===== پلیر ===== */
        
        .player {
            position: relative;
            width: 360px;
            max-width: 92vw;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 32px;
            padding: 24px 26px 30px;
            box-shadow: 0 20px 50px rgba(214, 51, 108, 0.3);
            text-align: center;
            z-index: 2;
        }
        /* ===== کیک تولد ===== */
        
        .cake {
            font-size: 52px;
            margin-bottom: 6px;
            display: inline-block;
            animation: cakeBounce 2s ease-in-out infinite;
        }
        
        @keyframes cakeBounce {
            0%,
            100% {
                transform: translateY(0) rotate(-3deg);
            }
            50% {
                transform: translateY(-8px) rotate(3deg);
            }
        }
        /* ===== پیام تبریک ===== */
        
        .bday-msg {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 4px;
            background: linear-gradient(90deg, #ff2e7e, #ff85b3, #ff2e7e);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite;
        }
        
        @keyframes shine {
            to {
                background-position: 200% center;
            }
        }
        
        .to-name {
            font-size: 15px;
            color: #c2185b;
            margin-bottom: 20px;
            font-weight: 600;
        }
        
        .cover {
            width: 160px;
            height: 160px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff6fa5, #ffc2d9, #ff6fa5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.5);
            transition: box-shadow .3s;
        }
        
        .cover.playing {
            animation: spin 6s linear infinite;
            box-shadow: 0 0 50px rgba(255, 105, 180, 0.95);
        }
        
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        
        .title {
            font-size: 17px;
            font-weight: 700;
            color: #c2185b;
            margin-bottom: 20px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .progress-wrap {
            width: 100%;
            height: 7px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 8px;
            overflow: hidden;
        }
        
        .progress {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff4f8b, #ff8fb8);
            border-radius: 10px;
        }
        
        .times {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #b0456e;
            margin-bottom: 18px;
        }
        
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        button {
            border: none;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.7);
            color: #d6336c;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform .2s, background .2s;
        }
        
        button:hover {
            transform: scale(1.12);
            background: #fff;
        }
        
        button:active {
            transform: scale(0.95);
        }
        
        .play-btn {
            width: 72px;
            height: 72px;
            font-size: 28px;
            background: linear-gradient(135deg, #ff4f8b, #ff85b3);
            color: #fff;
            box-shadow: 0 8px 22px rgba(255, 79, 139, 0.55);
            animation: pulse 2s ease-in-out infinite;
        }
        
        .play-btn:hover {
            background: linear-gradient(135deg, #ff3d7f, #ff6fa5);
        }
        
        @keyframes pulse {
            0%,
            100% {
                box-shadow: 0 8px 22px rgba(255, 79, 139, 0.55);
            }
            50% {
                box-shadow: 0 8px 35px rgba(255, 79, 139, 0.95);
            }
        }
        /* ===== کانفتی ===== */
        
        .confetti {
            position: fixed;
            width: 10px;
            height: 16px;
            top: -20px;
            z-index: 999;
            pointer-events: none;
            animation: confettiFall 3s linear forwards;
        }
        
        @keyframes confettiFall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <!-- بادکنک‌ها -->
    <div class="balloon" style="left:6%;  background:#ff4f8b; animation-duration:14s; animation-delay:0s;  width:55px;height:70px;"></div>
    <div class="balloon" style="left:18%; background:#ff9ec4; animation-duration:18s; animation-delay:3s;  width:42px;height:55px;"></div>
    <div class="balloon" style="left:82%; background:#ff6fa5; animation-duration:16s; animation-delay:1s;  width:50px;height:64px;"></div>
    <div class="balloon" style="left:92%; background:#ffb3d1; animation-duration:20s; animation-delay:5s;  width:38px;height:50px;"></div>
    <div class="balloon" style="left:70%; background:#ff3d7f; animation-duration:15s; animation-delay:7s;  width:46px;height:60px;"></div>
    <div class="balloon" style="left:30%; background:#ffc2d9; animation-duration:19s; animation-delay:9s;  width:44px;height:58px;"></div>

    <!-- حباب‌ها -->
    <div class="bubble" style="width:120px;height:120px;top:10%;left:8%"></div>
    <div class="bubble" style="width:80px;height:80px;top:70%;left:15%;animation-delay:2s"></div>
    <div class="bubble" style="width:160px;height:160px;top:20%;right:5%;animation-delay:4s"></div>
    <div class="bubble" style="width:60px;height:60px;bottom:12%;right:12%;animation-delay:1s"></div>

    <div class="player">
        <div class="cake">🎂</div>
        <div class="bday-msg">Happy Birthday</div>
        <div class="cover" id="cover">🎵</div>
        <div class="title" id="title">Refighe man</div>

        <div class="progress-wrap" id="progressWrap">
            <div class="progress" id="progress"></div>
        </div>
        <div class="times">
            <span id="current">0:00</span>
            <span id="duration">0:00</span>
        </div>

        <div class="controls">
            <button class="play-btn" id="play" title="پخش / توقف">▶</button>
        </div>
    </div>

    <!-- 👇 اسم فایل آهنگت رو اینجا بذار -->
    <audio id="audio" src="Refighe man.mp3" preload="metadata"></audio>

    <script>
        const audio = document.getElementById('audio');
        const playBtn = document.getElementById('play');
        const cover = document.getElementById('cover');
        const progress = document.getElementById('progress');
        const progressWrap = document.getElementById('progressWrap');
        const currentEl = document.getElementById('current');
        const durationEl = document.getElementById('duration');

        /* ===== قلب و ستاره درخشان ===== */
        const icons = ['💖', '✨', '💕', '⭐', '🌸', '💗', '🌟'];
        setInterval(() => {
            const el = document.createElement('div');
            el.className = 'sparkle';
            el.textContent = icons[Math.floor(Math.random() * icons.length)];
            el.style.left = Math.random() * 100 + 'vw';
            el.style.fontSize = (14 + Math.random() * 16) + 'px';
            el.style.animationDuration = (6 + Math.random() * 5) + 's';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 12000);
        }, 500);

        /* ===== کانفتی ===== */
        function launchConfetti() {
            const colors = ['#ff4f8b', '#ff85b3', '#ffc2d9', '#fff', '#ff2e7e', '#ffd700', '#ff9ec4'];
            for (let i = 0; i < 80; i++) {
                const c = document.createElement('div');
                c.className = 'confetti';
                c.style.left = Math.random() * 100 + 'vw';
                c.style.background = colors[Math.floor(Math.random() * colors.length)];
                c.style.animationDuration = (2 + Math.random() * 2) + 's';
                c.style.animationDelay = (Math.random() * 0.5) + 's';
                if (Math.random() > 0.5) c.style.borderRadius = '50%';
                document.body.appendChild(c);
                setTimeout(() => c.remove(), 5000);
            }
        }

        /* ===== کنترل پخش ===== */
        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                launchConfetti(); // 🎊 جشن!
            } else {
                audio.pause();
            }
        });

        audio.addEventListener('play', () => {
            playBtn.textContent = '⏸';
            cover.classList.add('playing');
        });
        audio.addEventListener('pause', () => {
            playBtn.textContent = '▶';
            cover.classList.remove('playing');
        });
        audio.addEventListener('ended', () => {
            playBtn.textContent = '▶';
            cover.classList.remove('playing');
            progress.style.width = '0%';
            currentEl.textContent = '0:00';
            launchConfetti(); // 🎊 دوباره جشن وقتی تموم شد
        });

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                progress.style.width = (audio.currentTime / audio.duration) * 100 + '%';
                currentEl.textContent = fmt(audio.currentTime);
            }
        });
        audio.addEventListener('loadedmetadata', () => {
            durationEl.textContent = fmt(audio.duration);
        });

        progressWrap.addEventListener('click', (e) => {
            if (!audio.duration) return;
            const rect = progressWrap.getBoundingClientRect();
            audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
        });

        function fmt(sec) {
            if (isNaN(sec)) return '0:00';
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60).toString().padStart(2, '0');
            return m + ':' + s;
        }
    </script>

</body>

</html>
